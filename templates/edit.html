
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Lead</title>
</head>
<body>
    <h1>Edit Lead</h1>

    <form method="POST">
        <label>Name</label><br>
        <input name="name" value="{{ lead.name }}" required><br><br>

        <label>Designation</label><br>
        <input name="designation" value="{{ lead.designation }}" required><br><br>

        <label>Industry</label><br>
        <input name="industry" value="{{ lead.industry }}" required><br><br>

        <button type="submit">Update Lead</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
